# Профиль устройства mKey: дешёвые USB-геймпады и джойстики на контроллере DragonRise
# (VID:PID 0079:0006, «Generic USB Joystick»). Их кнопки пронумерованы на корпусе 1…12;
# по стандарту HID кнопка N приходит кодом BTN_TRIGGER + N − 1, поэтому имена B1…B12
# совпадают с цифрами на корпусе. Оси и крестовина у таких геймпадов имеют стандартные имена.
version: 1
title: "DragonRise Generic USB Joystick"
match:
  vid: "0079"
  pid: "0006"
buttons:
  BTN_TRIGGER: B1
  BTN_THUMB: B2
  BTN_THUMB2: B3
  BTN_TOP: B4
  BTN_TOP2: B5
  BTN_PINKIE: B6
  BTN_BASE: B7
  BTN_BASE2: B8
  BTN_BASE3: B9
  BTN_BASE4: B10
  BTN_BASE5: B11
  BTN_BASE6: B12
