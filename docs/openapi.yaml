openapi: 3.1.0
info:
  title: mKey daemon API
  version: 1.0.0
  description: |
    HTTP API демона mKey (SPEC §9, модуль internal/api).

    Транспорты:
    - Unix-сокет `$XDG_RUNTIME_DIR/mkey/mkey.sock` (права 0600) — для CLI, без токена;
    - `http://127.0.0.1:17420` — для веб-интерфейса: заголовок `Host` только 127.0.0.1/localhost,
      для изменяющих запросов `Origin` — только страницы mKey, токен из `$XDG_RUNTIME_DIR/mkey/token`
      в заголовке `Authorization: Bearer …` или cookie `mkey_session` (ставится при входе по `/?t=<токен>`).

    Сообщения ошибок переводятся на язык из `Accept-Language` (ru, en).
servers:
  - url: http://127.0.0.1:17420
security:
  - bearer: []
  - cookie: []
paths:
  /api/v1/status:
    get:
      summary: Состояние демона и модулей
      responses:
        "200":
          description: Состояние
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
  /api/v1/send:
    post:
      summary: Выполнить макрос (ответ — после завершения; разрыв соединения прерывает макрос)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sequence]
              additionalProperties: false
              properties:
                sequence: { type: string, example: '^{Shift}{"Привет, Вера!"}~{Shift}{Enter}' }
                dry_run: { type: boolean, description: "Только проверить, ничего не нажимая; в ответе — план шагов" }
      responses:
        "200":
          description: Макрос выполнен (или проверен)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  duration_ms: { type: integer }
                  steps: { type: array, items: { type: object }, description: "Только при dry_run" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/dsl/parse:
    post:
      summary: Разобрать макрос в дерево (для конструктора блоков)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TextRequest" }
      responses:
        "200":
          description: Дерево разбора
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes: { type: array, items: { $ref: "#/components/schemas/Node" } }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/dsl/format:
    post:
      summary: Привести макрос к каноническому виду
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TextRequest" }
      responses:
        "200":
          description: Канонический текст
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string, example: "^{Shift}{A}[1s]" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/stop:
    post:
      summary: Прервать все выполняющиеся макросы (их клавиши отпускаются)
      responses:
        "200":
          description: Число прерванных макросов
          content:
            application/json:
              schema:
                type: object
                properties:
                  stopped: { type: integer }
  /api/v1/panic:
    post:
      summary: Экстренная остановка — прервать всё и отпустить все клавиши на всех устройствах (SEC-1)
      responses:
        "200": { description: Выполнено }
  /api/v1/devices:
    get:
      summary: "Физические устройства ввода; auto_ids — авто-ID устройств (UnKey…) по пути, если работает инспектор"
      responses:
        "200":
          description: Устройства и доступ к ним
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices: { type: array, items: { type: object } }
                  status: { $ref: "#/components/schemas/InputStatus" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/devices/inspect:
    get:
      summary: "Подробности устройства (?ref= путь, eventN, постоянное имя by-id/by-path или часть названия): {device: DeviceDetails} — постоянные имена, шина, авто-ID устройства (auto_id) и кнопок (label: UnKey001), кнопки с именами mKey и ядра, оси с диапазонами, колёса, переключатели, индикаторы, отдача, свойства"
      parameters: [ { name: ref, in: query, required: true, schema: { type: string } } ]
      responses:
        "200": { description: "{device}" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "api.device_ambiguous: подходит несколько устройств; details.candidates — [{path, name}]" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/devices/rename:
    post:
      summary: "Дать имя устройству или его кнопке (FR-DEV-3): {device, control, name}; control пусто — устройство; name пусто — убрать имя. Ошибка имени — 400 api.rename_chars|key|auto|taken|unknown|ambiguous"
      responses: { "200": { description: "{ok}" }, "400": { $ref: "#/components/responses/Error" }, "503": { $ref: "#/components/responses/Error" } }
  /api/v1/devices/virtual:
    get:
      summary: "Виртуальные устройства включённых проектов (ADR-0028): {devices: [{name, template, project, system_name, node?, error?}], templates: [...], template_info: [{id, buttons: [South…], axes: [LX…]}]} — состав шаблонов для мастера «второй геймпад»"
      responses: { "200": { description: "{devices, templates, template_info}" }, "503": { $ref: "#/components/responses/Error" } }
  /api/v1/settings/devices:
    get:
      summary: "Настройки устройств: {auto_ids} — каким устройствам давать авто-ID (smart, all, unusual; ADR-0026)"
      responses: { "200": { description: "{auto_ids}" }, "503": { $ref: "#/components/responses/Error" } }
    put:
      summary: "Сменить режим авто-ID ({auto_ids}): применяется сразу и сохраняется в config.yaml; неизвестный режим — 400 api.auto_ids_bad"
      responses: { "200": { description: "{auto_ids}" }, "400": { $ref: "#/components/responses/Error" } }
  /api/v1/doctor:
    get:
      summary: Диагностика окружения (сообщения на языке клиента)
      responses:
        "200":
          description: Проверки
          content:
            application/json:
              schema:
                type: object
                properties:
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        status: { type: string, enum: [ok, info, warn, fail] }
                        message: { type: string }
                        message_key: { type: string }
                        fix: { type: string }
  /api/v1/layouts:
    get:
      summary: Раскладки клавиатуры пользователя
      responses:
        "200":
          description: Раскладки
          content:
            application/json:
              schema:
                type: object
                properties:
                  current: { type: string, example: ru }
                  available: { type: array, items: { type: string }, example: [ru, us] }
                  can_switch: { type: boolean }
                  source: { type: string, example: x11, description: "Источник раскладок (kde, gnome, x11, свой из точки layout_source) или config" }
                  blind: { type: boolean, description: "Раскладку системы не видно: текст печатается нажатиями клавиш как есть (ADR-0037)" }
  /api/v1/projects:
    get:
      summary: Проекты (id, name, enabled, events, remaps, path, error) и каталог проектов
      responses: { "200": { description: Список проектов } }
    post:
      summary: "Создать выключенный проект: {id, template?} (шаблон — встроенный или из плагина); скрипты шаблона возвращаются для показа (SEC-7)"
      responses: { "200": { description: "{id, scripts}" }, "400": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
  /api/v1/projects/import:
    post:
      summary: "Импортировать проект ({name, content}); новый проект выключен, скрипты (lua, shell) возвращаются, чтобы показать их код до включения (SEC-7)"
      responses: { "200": { description: "{id, scripts: [{event, type, code?, file?}]}" }, "400": { $ref: "#/components/responses/Error" } }
  /api/v1/projects/{id}/{action}:
    post:
      summary: Включить или выключить проект (action = enable | disable)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { enum: [enable, disable] } }
      responses: { "200": { description: Выполнено }, "400": { $ref: "#/components/responses/Error" } }
  /api/v1/events:
    get:
      summary: Состояние всех событий (EventStatus)
      responses: { "200": { description: "{events: [...]}" } }
  /api/v1/events/{project}/{event}/{action}:
    post:
      summary: Запустить (run, ждёт завершения), включить (enable) или выключить (disable) событие
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: event, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { enum: [run, enable, disable] } }
      responses: { "200": { description: Выполнено }, "404": { $ref: "#/components/responses/Error" } }
  /api/v1/vars/{project}:
    get:
      summary: Переменные активного проекта
      parameters: [ { name: project, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: "{vars: {...}}" }, "404": { $ref: "#/components/responses/Error" } }
  /api/v1/vars/{project}/{name}:
    put:
      summary: "Задать переменную ({value})"
      parameters:
        - { name: project, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Выполнено } }
  /api/v1/wait/key:
    post:
      summary: "Ждать нажатия клавиши ({key, timeout_ms}); 408 — время вышло"
      responses: { "200": { description: Нажата }, "408": { $ref: "#/components/responses/Error" } }
  /api/v1/resume:
    post:
      summary: Продолжить работу после экстренной остановки (перехват и триггеры)
      responses: { "200": { description: Выполнено } }
  /api/v1/registry:
    get:
      summary: Зарегистрированные виды (trigger, condition, action, …) с метаданными и JSON Schema параметров
      description: |
        Виды — в порядке регистрации. К метаданным добавлены `name`, `description`, `category_name`
        на языке из `Accept-Language`; в схемах — `title` у полей и вариантов, `x-enum-labels`
        у списков значений. Подсказки для конструктора GUI: `x-widget` (key, keys, macro, ms,
        multiline, code, event, project, variable, device, time, value, actions, conditions),
        `x-lang` (lua, shell), `x-advanced` (поле под «Подробнее»). См. docs/modules.md.
      responses: { "200": { description: "{точка: [ExtensionMeta + name, description, category_name]}" } }
  /api/v1/projects/{id}/export:
    get:
      summary: "Файл проекта для сохранения и обмена (ADR-0027): в раздел devices дописаны имена кнопок устройств, которые встречаются в проекте; комментарии сохраняются; нет проекта — 404"
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: "application/yaml (Content-Disposition)" }, "404": { $ref: "#/components/responses/Error" } }
  /api/v1/projects/{id}:
    get:
      summary: "Проект — структура и текст файла ({project, raw, path, error})"
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: Проект }, "404": { $ref: "#/components/responses/Error" } }
    put:
      summary: "Сохранить проект после полной проверки — {project} (из конструктора) или {raw} (текст YAML, комментарии сохраняются)"
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: Сохранено }, "400": { $ref: "#/components/responses/Error" } }
    delete:
      summary: Удалить проект (файл)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: Удалено }, "400": { $ref: "#/components/responses/Error" } }
  /api/v1/projects/validate:
    post:
      summary: "Проверить проект ({project} или {raw}), не сохраняя"
      responses: { "200": { description: Ошибок нет }, "400": { $ref: "#/components/responses/Error" } }
  /api/v1/scripts:
    get:
      summary: "Раздел «Скрипты»: {languages: [{id, name, highlight, dir, ext}], files: [{lang, name, size, modified}]}"
      description: "Языки регистрируют модули (точка script_language): lua — *.lua, shell — *.sh в их папках scripts_dir."
      responses: { "200": { description: Языки и файлы } }
  /api/v1/scripts/{lang}/{name}:
    get:
      summary: "Текст файла скрипта: {content}"
      responses: { "200": { description: Текст }, "400": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
    put:
      summary: "Сохранить файл скрипта {content}: {ok, problem?} — problem {line, message} — ошибка синтаксиса (файл всё равно сохранён)"
      description: "Имя — только имя файла (без папок, не с точки) с расширением языка, иначе 400 api.script_name_bad; неизвестный язык — 404 api.script_lang_unknown."
      responses: { "200": { description: Сохранено }, "400": { $ref: "#/components/responses/Error" }, "404": { $ref: "#/components/responses/Error" } }
    delete:
      summary: "Удалить файл скрипта"
      responses: { "200": { description: Удалено }, "404": { $ref: "#/components/responses/Error" } }
  /api/v1/scripts/{lang}/check:
    post:
      summary: "Проверить синтаксис {content} без сохранения и запуска: {problem?}"
      responses: { "200": { description: Результат проверки } }
  /api/v1/settings/timing:
    get:
      summary: "Интервалы нажатий по умолчанию: {key_hold_ms, key_delay_ms, layout_switch_ms}"
      responses: { "200": { description: Интервалы } }
    put:
      summary: "Изменить интервалы нажатий (действуют сразу, сохраняются в config.yaml, modules.engine)"
      description: "Пределы: key_hold_ms и key_delay_ms — 0…1000, layout_switch_ms — 0…5000 мс; вне пределов — 400 api.timing_bad."
      responses: { "200": { description: Новые интервалы }, "400": { $ref: "#/components/responses/Error" } }
  /api/v1/projects/{id}/events/{event}/dry_run:
    post:
      summary: "Сухой прогон события ({project} — проект в том виде, в каком он в окне; можно несохранённый)"
      description: |
        Что сделает событие и когда, без нажатий и без побочных действий (FR-UI-6): шаги макросов со
        временем начала, группы «Повторять»/«Если» (тело один раз, время повтора умножено), заметки
        (переменные, уведомления, запуск событий), действия без описания для прогона (скрипты,
        плагины) — строкой `action`. Время примерное: обычное нажатие — `key_hold_ms` + `key_delay_ms`,
        случайная пауза — по наименьшей. Таймлайн длиннее 1000 строк обрезается (`truncated`).
        Ответ: `{steps: [DryStep], total_ms, open?, truncated?}`; DryStep — `{at_ms, depth, kind,
        keys?, count?, ms?, max_ms?, text?, dx?, dy?, value?, points?, device?, key?, args?, action?,
        conditions?}` (contracts.DryStep).
      responses:
        "200": { description: "Таймлайн" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/templates:
    get:
      summary: "Шаблоны проектов ({templates: [{id, name, description, content}]}, названия — на языке клиента)"
      responses: { "200": { description: Шаблоны } }
  /api/v1/stream:
    get:
      summary: Поток новостей (Server-Sent Events) для веб-интерфейса
      description: |
        События: `store.projects_changed` ([id]), `store.project_error`, `engine.project_error`,
        `engine.event_started` (EventRef), `engine.event_finished` (EventRef + error),
        `input.emergency`, `input.resumed`, `input.device_added` / `input.device_removed` ({path, name}),
        `input.access_changed`, `recorder.started` / `recorder.stopped` (RecordingInfo).
        Раз в 15 с — комментарий `: ping`.
      responses: { "200": { description: "text/event-stream" } }
  /api/v1/capture/key:
    post:
      summary: "Ждать нажатия ({timeout_ms, combo}); combo — сочетание до первого отпускания (\"Ctrl+H\")"
      responses:
        "200": { description: "{name, code, kernel, device, device_name}" }
        "408": { $ref: "#/components/responses/Error" }
  /api/v1/input/watch:
    get:
      summary: "Монитор нажатий (Server-Sent Events, событие input): клавиши, кнопки, оси (не чаще 10 раз в секунду на ось), колесо; ?moves=1 — и перемещения мыши; ?device=<ссылка> — только устройства по ссылке"
      description: |
        Данные: {time, device, device_name, kind (key|axis|wheel|move), name (имя для макросов или #код),
        kernel, code, action (down|up), value, dy}. Нажатия только передаются, пока открыт поток, и
        демоном никуда не сохраняются (NFR-8): файл журнала создаёт окно или `mkey devices watch --out`
        по просьбе человека. ?device — путь, event6, постоянное имя или часть названия (все подходящие
        устройства); не нашлось — 404 api.device_not_found до начала потока.
      responses: { "200": { description: "text/event-stream" }, "404": { $ref: "#/components/responses/Error" } }
  /api/v1/dsl/to_actions:
    post:
      summary: "Разобрать макрос на отдельные действия (блоки) — {text} → {actions}"
      responses: { "200": { description: "{actions: [{type, value}]}" }, "400": { $ref: "#/components/responses/Error" } }
  /api/v1/actions/to_dsl:
    post:
      summary: "Склеить действия в один макрос — {actions} → {text}; 400, если действие нельзя записать макросом"
      responses: { "200": { description: "{text}" }, "400": { $ref: "#/components/responses/Error" } }
  /api/v1/emergency:
    post:
      summary: Экстренная остановка (как Esc+Backspace+Enter); mKey приостановлен до /resume
      responses: { "200": { description: Выполнено } }
  /api/v1/doctor/fix:
    post:
      summary: Выдать доступ к устройствам ввода лучшим способом повышения прав
      responses: { "200": { description: "{ok, method} или {manual_command}" } }
  /api/v1/uninstall:
    post:
      summary: "Удалить mKey ({keep_config}); запускает `mkey uninstall --yes` отдельным процессом"
      responses: { "200": { description: Удаление запущено } }
  /api/v1/logs:
    get:
      summary: Последние строки журнала (?lines=N, по умолчанию 200, не больше 2000)
      responses: { "200": { description: "{lines: [...]}" } }
  /api/v1/places:
    get:
      summary: "Где mKey хранит файлы пользователя ({places: [{id, ids, name, description, path, display, is_dir, exists}]}); места регистрируют модули (точка расширения place), порядок — по Order; места с одинаковым путём — одной строкой (ids); display — путь с «~» вместо домашней папки"
      responses: { "200": { description: Места } }
  /api/v1/recordings:
    get:
      summary: "Записи ввода ({recordings: [RecordingInfo], current?: RecordingInfo, dir: папка записей}); у файла с ошибкой — problem {line, text, code, arg, message}"
      responses: { "200": { description: Записи } }
  /api/v1/recordings/{name}:
    delete:
      summary: Удалить запись
      parameters: [ { name: name, in: path, required: true, schema: { type: string } } ]
      responses: { "200": { description: Удалено }, "404": { $ref: "#/components/responses/Error" } }
  /api/v1/recordings/{name}/convert:
    post:
      summary: "Превратить запись в блоки конструктора ({simplify}: упростить движения мыши) — новый выключенный проект; ответ {project}; 400 api.recording_empty — нечего превращать"
      parameters: [ { name: name, in: path, required: true, schema: { type: string } } ]
      responses:
        "200": { description: "{project: ID нового проекта}" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/recordings/status:
    get:
      summary: "Идущая запись: {recording, info}"
      responses: { "200": { description: Состояние } }
  /api/v1/recordings/start:
    post:
      summary: "Начать запись ({name, kinds}); 409 — запись уже идёт"
      responses: { "200": { description: RecordingInfo (с stop_hotkey) }, "409": { $ref: "#/components/responses/Error" } }
  /api/v1/recordings/stop:
    post:
      summary: "Закончить запись ({cut}: сочетание остановки для вырезания, например Ctrl+C); 409 — запись не идёт"
      responses: { "200": { description: RecordingInfo }, "409": { $ref: "#/components/responses/Error" } }
  /api/v1/recordings/wait:
    post:
      summary: Ждать окончания идущей записи (сочетанием, из окна или другой командой)
      responses: { "200": { description: RecordingInfo }, "409": { $ref: "#/components/responses/Error" } }
  /api/v1/play:
    post:
      summary: "Воспроизвести запись и ждать окончания ({name, speed, repeat, skip_moves, fixed_pause_ms}); геймпады и сенсорные экраны записи — на временных копиях; разрыв соединения останавливает; ошибка в файле — 400 api.recording_bad, details — RecordingProblem"
      responses:
        "200": { description: Готово }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/settings/hotkeys:
    get:
      summary: "Системные сочетания mKey: {record, emergency} (запись зажатием, например ^{LCtrl}^{RAlt}{Space})"
      responses: { "200": { description: Сочетания } }
    put:
      summary: "Изменить сочетания ({record?, emergency?}): проверяются, применяются сразу, сохраняются в config.yaml"
      responses:
        "200": { description: "{record, emergency}" }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/recordings/devices:
    get:
      summary: "Устройства для выбора «что записывать»: {devices: [{key, id, name, path, category, kinds, virtual, own, selected, explicit}]}"
      description: |
        category — keyboards, gamepads, touch, other, virtual (созданные программами; own — самим mKey,
        такие не записываются). selected — будет ли записываться: свой выбор (explicit, settings.devices)
        или по классам settings.kinds.
      responses: { "200": { description: Устройства } }
  /api/v1/settings/recording:
    get:
      summary: "Настройки записи по умолчанию: {kinds, devices, moves, merge_moves_ms, center_pointer, coalesce_ms} (devices — «VID:PID имя» → записывать ли; kinds может быть пустым)"
      responses:
        "200": { description: Настройки записи }
        "503": { $ref: "#/components/responses/Error" }
    put:
      summary: "Изменить настройки записи: проверяются (api.record_settings_bad), действуют со следующей записи, сохраняются в config.yaml (modules.recorder)"
      responses:
        "200": { description: Новые настройки }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/settings/interface:
    get:
      summary: "Язык и тема окна из config.yaml: {language: ru|en|\"\", theme: system|light|dark}"
      responses: { "200": { description: Язык и тема } }
    put:
      summary: "Сохранить язык (language в начале config.yaml) и тему (modules.api.theme); неверные — 400 api.interface_bad"
      responses:
        "200": { description: Сохранённые значения }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/plugins:
    get:
      summary: "Плагины (ADR-0029): {plugins: [{id, version, kind, name, description, dir, system, permissions, active, state, error, actions, conditions, triggers, templates}], dir}"
      responses: { "200": { description: "{plugins, dir}" }, "503": { $ref: "#/components/responses/Error" } }
  /api/v1/plugins/install:
    post:
      summary: "Установить плагин (выключенным): JSON {path} — папка или .zip на этом компьютере, либо тело application/zip — загруженный архив"
      responses:
        "200": { description: Сведения о плагине }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/v1/plugins/{id}/{action}:
    post:
      summary: "enable | disable — включить или выключить; список включённых сохраняется в config.yaml (modules.plugins.active)"
      responses: { "200": { description: "{ok}" }, "404": { $ref: "#/components/responses/Error" } }
  /api/v1/plugins/{id}:
    delete:
      summary: "Удалить плагин пользователя (системный — 400 api.plugin_system)"
      responses: { "200": { description: "{ok}" }, "404": { $ref: "#/components/responses/Error" } }
  /api/v1/plugins/{id}/log:
    get:
      summary: "Журнал плагина (stderr): ?lines=N (200) → {lines}"
      responses: { "200": { description: "{lines}" } }
  /api/v1/update:
    get:
      summary: "Версии mKey (ADR-0030): {current, latest?, available, url?, can_apply, reason? (package|dev), check} — без обращения к сети"
      responses: { "200": { description: UpdateInfo }, "503": { $ref: "#/components/responses/Error" } }
  /api/v1/update/check:
    post:
      summary: "Спросить последний выпуск на GitHub (по просьбе человека)"
      responses: { "200": { description: UpdateInfo }, "502": { $ref: "#/components/responses/Error" } }
  /api/v1/update/apply:
    post:
      summary: "Установить новую версию: скачать, сверить sha256, заменить программу, перезапустить mKey; нельзя (пакет, dev) — 400 api.update_cannot"
      responses:
        "200": { description: UpdateInfo }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/v1/settings/update:
    put:
      summary: "Проверять обновления раз в сутки: {check} — сохраняется в config.yaml (modules.update.check)"
      responses: { "200": { description: UpdateInfo } }
  /api/v1/shutdown:
    post:
      summary: Корректно завершить демон
      responses:
        "200": { description: Демон завершается }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    cookie: { type: apiKey, in: cookie, name: mkey_session }
  responses:
    Error:
      description: Ошибка в едином формате
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string, example: dsl.unknown_key_hint }
                  message: { type: string, example: "неизвестная клавиша «Mous0» — возможно, вы имели в виду «Mouse0»?" }
                  details:
                    type: object
                    properties:
                      pos:
                        type: object
                        properties:
                          line: { type: integer }
                          col: { type: integer }
                      args: { type: object, additionalProperties: { type: string } }
  schemas:
    TextRequest:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string }
    InputStatus:
      type: object
      properties:
        open: { type: integer }
        denied: { type: array, items: { type: string } }
    Status:
      type: object
      properties:
        version: { type: string }
        commit: { type: string }
        pid: { type: integer }
        started_at: { type: string, format: date-time }
        port: { type: integer }
        running: { type: integer }
        modules:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              core: { type: boolean }
              state: { type: string }
              error: { type: string }
        input: { $ref: "#/components/schemas/InputStatus" }
        grab_suspended: { type: boolean }
        output:
          type: object
          properties:
            available: { type: boolean }
            error: { type: string }
    Node:
      type: object
      description: Узел дерева разбора (internal/lib/dsl.Node); используются поля, относящиеся к type.
      properties:
        type: { type: string, enum: [tap, down, up, up_all, axis, pause, text, command, group] }
        pos: { type: object, properties: { line: { type: integer }, col: { type: integer } } }
        keys:
          type: array
          items:
            type: object
            properties:
              device: { type: string }
              name: { type: string }
              code: { type: integer }
        repeat: { type: integer }
        hold_ms: { type: integer }
        value: { type: number }
        min_ms: { type: integer }
        max_ms: { type: integer }
        text: { type: string }
        command: { type: string }
        args: { type: array, items: { type: object } }
        children: { type: array, items: { $ref: "#/components/schemas/Node" } }
