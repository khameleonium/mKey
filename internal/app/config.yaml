# Настройки mKey (config.yaml). Создатель mKey: Илья Ульянов | khameleonium
#
# Здесь перечислены ВСЕ настройки программы с пояснениями и значениями по умолчанию.
# Почти всё это же меняется в окне программы («Настройки», «Устройства») — окно записывает
# изменения сюда же. Правки, сделанные в этом файле вручную, действуют после перезапуска mKey
# (значок в трее → «Выйти из mKey», затем снова открыть mKey).
#
# Как править: меняйте только значение после двоеточия, отступы (пробелы слева) не трогайте.
# Строки, начинающиеся с «#», — пояснения, mKey их не читает.
# Ошибка в файле? mKey не запустится и напишет, в какой строке ошибка.
# Новые настройки из следующих версий mKey допишет сюда сам, ваши значения не изменятся.
# Проекты (горячие клавиши, макросы) лежат не здесь, а в папке projects рядом с этим файлом.

# Версия формата файла — не меняйте.
version: 2

# Язык программы: "ru", "en" или "" (как в системе).
language: ""

modules:
  # ── Запись действий ───────────────────────────────────────────────────────────
  recorder:
    # Включён ли модуль записи (false — выключить запись и воспроизведение).
    enabled: true
    # Сочетание «начать/закончить запись» в любой программе ("" — выключено).
    # ^{Клавиша} — зажать; по умолчанию: левый Ctrl + правый Alt + Пробел.
    hotkey: "^{LCtrl}^{RAlt}{Space}"
    # Какие устройства записывать: keyboard (клавиатура), mouse (мышь), touchpad (тачпад),
    # touchscreen (сенсорный экран), tablet (планшет), gamepad (геймпад), joystick (джойстик),
    # other (прочие).
    kinds: [keyboard, mouse]
    # Записывать движения мыши (false — только нажатия кнопок и колесо).
    moves: true
    # Склеивать движения мыши ближе стольких миллисекунд в одно: файл короче, но повтор
    # рисует путь курсора чуть крупнее (система сильнее разгоняет склеенные движения).
    # 0 — записывать каждое движение, как было (по умолчанию; от 0 до 1000).
    merge_moves_ms: 0
    # Ставить курсор в центр экрана перед записью: движения повторяются точнее.
    center_pointer: true
    # Склеивать движения мыши при воспроизведении, миллисекунды: меньше нагрузки, но путь
    # курсора чуть крупнее записанного. 0 — не склеивать (по умолчанию; до 1000).
    coalesce_ms: 0
    # Папка записей ("" — ~/.local/share/mkey/recordings).
    dir: ""

  # ── Окно программы ───────────────────────────────────────────────────────────
  api:
    # Тема окна: "system" (как в системе), "light" (светлая) или "dark" (тёмная).
    theme: "system"
    # Порт окна программы в браузере (http://127.0.0.1:17420). 0 — не открывать.
    port: 17420
    # Технические пути ("" — по умолчанию). Менять не нужно.
    runtime_dir: ""
    log_file: ""
    config_file: ""

  # ── Значок в трее ────────────────────────────────────────────────────────────
  tray:
    # Показывать значок mKey в трее (false — не показывать).
    enabled: true

  # ── Проекты ──────────────────────────────────────────────────────────────────
  store:
    # Папка проектов ("" — ~/.config/mkey/projects).
    dir: ""
    # Создать проект-пример при первом запуске.
    example: true

  # ── Устройства ───────────────────────────────────────────────────────────────
  inspector:
    # Каким устройствам давать номера-имена вида {UnKey001}:
    # "smart" — всем, кроме служебных (по умолчанию), "all" — всем, "unusual" — только необычным.
    auto_ids: "smart"
    # Файл с номерами и именами устройств ("" — ~/.config/mkey/devices.yaml).
    devices_file: ""
    # Папка устройств ввода ("" — /dev/input). Менять не нужно.
    input_dir: ""

  # ── Ввод с клавиатур, мышей, геймпадов ───────────────────────────────────────
  input:
    # Экстренная остановка: все клавиши нажаты одновременно — mKey всё отпускает и останавливает.
    emergency_stop: "^{Esc}^{Backspace}{Enter}"
    # Если обработка нажатий зависла дольше стольких миллисекунд, mKey отпускает клавиатуру.
    watchdog_ms: 500
    # Технические настройки. Менять не нужно.
    dir: "/dev/input"
    retry_attempts: 10
    retry_delay_ms: 100
    uinput_path: "/dev/uinput"
    settle_ms: 300

  # ── Нажатия, которые делает mKey ─────────────────────────────────────────────
  output:
    # Не больше стольких нажатий и движений в секунду на устройство (защита от «бури»; 0 — без предела).
    max_events_per_second: 2000
    # Технические настройки. Менять не нужно.
    uinput_path: "/dev/uinput"
    settle_ms: 500

  # ── Выполнение макросов ──────────────────────────────────────────────────────
  # Интервалы нажатий меняются и в окне: «Настройки» → «Нажатия mKey».
  engine:
    # Сколько миллисекунд держать клавишу при обычном нажатии {A}.
    key_hold_ms: 20
    # Пауза после каждого нажатия и каждого символа текста, миллисекунды.
    key_delay_ms: 10
    # Пауза после переключения раскладки (чтобы система успела), миллисекунды.
    layout_switch_ms: 60
    # Файл сохраняемых переменных ("" — ~/.local/state/mkey/vars.json).
    vars_file: ""

  # ── Горячие клавиши ──────────────────────────────────────────────────────────
  hotkeys:
    # Включены ли горячие клавиши проектов (false — выключить).
    enabled: true

  # ── Рабочий стол: раскладки и размер экрана ──────────────────────────────────
  desktop:
    # Раскладки, если mKey не может узнать их сам (для набора текста): например [us, ru].
    layouts: [us]
    # Текущая раскладка в этом случае ("" — первая из списка).
    layout: ""
    # Размер экрана в пикселях для касаний в пикселях ({Touch 960 540}), например "1920x1080".
    # "" — не задан: касания в процентах ({Touch 50% 80%}) работают всегда.
    screen: ""

  # ── Скрипты ──────────────────────────────────────────────────────────────────
  lua:
    # Папка файлов скриптов Lua ("" — ~/.config/mkey/scripts).
    scripts_dir: ""
  shell:
    # Папка файлов скриптов bash ("" — ~/.config/mkey/scripts).
    scripts_dir: ""
    # Сколько миллисекунд скрипт может работать, прежде чем mKey его остановит.
    timeout_ms: 60000
    # Программа, которая выполняет скрипты ("" — bash, если есть, иначе sh).
    shell: ""

  # ── Плагины ──────────────────────────────────────────────────────────────────
  plugins:
    # Включён ли модуль плагинов (false — плагины не запускаются).
    enabled: true
    # Включённые плагины (их ID). Новый плагин выключен, пока вы его не включите:
    # «Плагины» в окне или mkey plugin enable <id>. Пример: [io.example.hello]
    active: []
    # Папка ваших плагинов ("" — ~/.local/share/mkey/plugins).
    dir: ""
    # Папка плагинов из пакетов ("" — /usr/share/mkey/plugins).
    system_dir: ""
    # Папка журналов плагинов ("" — ~/.local/state/mkey/plugins).
    log_dir: ""

  # ── Обновления ───────────────────────────────────────────────────────────────
  update:
    # Включён ли модуль обновлений.
    enabled: true
    # Раз в сутки проверять, вышла ли новая версия mKey (обращение к GitHub). По умолчанию
    # выключено: без вашего согласия mKey в интернет не ходит. Кнопка «Проверить» работает всегда.
    check: false
    # Где искать выпуски (менять не нужно).
    repo: "khameleonium/mKey"
    api: "https://api.github.com"

  # ── Проверка системы ─────────────────────────────────────────────────────────
  setup:
    # Через сколько миллисекунд после запуска проверить систему и сообщить о проблемах (0 — не проверять).
    startup_check_ms: 5000
